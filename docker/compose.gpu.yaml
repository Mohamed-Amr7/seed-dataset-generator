# MultiSeedGen - GPU compose service.
#
# REQUIRES the NVIDIA Container Toolkit on the host (see GPU_SETUP.md). Without
# it, `deploy.resources.reservations.devices` / --gpus fails with
# "could not select device driver". This mirrors seed-bank's prod GPU worker.
#
#   docker compose -f docker/compose.gpu.yaml up --build        # Web UI on :8000
#   docker compose -f docker/compose.gpu.yaml run --rm multiseedgen \
#       python -m multiseedgen --sources /data/seeds --out /data/out --num-images 2000
services:
  multiseedgen:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: multiseedgen:gpu
    container_name: multiseedgen-gpu
    ports:
      - "8000:8000"
    volumes:
      - ../seeds:/data/seeds:ro       # source single-seed images (read-only)
      - ./_out:/data/out              # generated datasets
      - ./_models:/models             # rembg/U2Net model cache (persist downloads)
    environment:
      - MULTISEEDGEN_DATA_ROOT=/data  # web UI browses datasets under here
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # OPT-IN SAM service. Gated behind the "sam" profile, so a plain
  #   docker compose -f docker/compose.gpu.yaml up
  # never builds or pulls it (the default service stays light + torch-free).
  # Enable explicitly:
  #   docker compose -f docker/compose.gpu.yaml --profile sam up --build multiseedgen-sam
  #   docker compose -f docker/compose.gpu.yaml --profile sam run --rm multiseedgen-sam \
  #       python -m multiseedgen --sources /data/seeds --out /data/out --num-images 2000 \
  #       --segment sam --sam-checkpoint models/sam_vit_b_01ec64.pth --sam-model-type vit_b
  multiseedgen-sam:
    profiles: ["sam"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.sam   # CPU torch (default TORCH_INDEX)
    image: multiseedgen:sam
    container_name: multiseedgen-sam
    ports:
      - "8001:8000"                   # avoid clashing with the default service on :8000
    volumes:
      - ../seeds:/data/seeds:ro       # source single-seed images (read-only)
      - ./_out:/data/out              # generated datasets
      - ./_models:/models             # rembg/U2Net model cache (persist downloads)
      - ../models:/app/models:ro      # SAM checkpoint: --sam-checkpoint resolves against
                                      # WORKDIR /app, so the repo models/ lands at /app/models
    environment:
      - MULTISEEDGEN_DATA_ROOT=/data  # web UI browses datasets under here
    # NO deploy.reservations.devices: a GPU reservation FAILS the run when the NVIDIA
    # Container Toolkit is absent. Use the multiseedgen-sam-gpu service below for GPU.
    restart: unless-stopped

  # OPT-IN SAM on the GPU. Same image but built with CUDA torch (cu126 - driver 580 is
  # backward-compatible; use cu130 to match CUDA 13 exactly). REQUIRES the NVIDIA
  # Container Toolkit (GPU_SETUP.md "Path 2"); without it the device reservation fails
  # the run. Gated behind its own "sam-gpu" profile so neither it nor the CPU SAM
  # service is ever touched by a default `docker compose up`.
  #   docker compose -f docker/compose.gpu.yaml --profile sam-gpu up --build multiseedgen-sam-gpu
  #   docker compose -f docker/compose.gpu.yaml --profile sam-gpu run --rm multiseedgen-sam-gpu \
  #       python -m multiseedgen --sources /data/seeds --out /data/out --num-images 2000 \
  #       --segment sam --sam-checkpoint models/sam_vit_b_01ec64.pth --sam-model-type vit_b
  multiseedgen-sam-gpu:
    profiles: ["sam-gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.sam
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126   # CUDA torch wheels
    image: multiseedgen:sam-gpu
    container_name: multiseedgen-sam-gpu
    ports:
      - "8002:8000"                   # distinct port from the CPU SAM service
    volumes:
      - ../seeds:/data/seeds:ro
      - ./_out:/data/out
      - ./_models:/models
      - ../models:/app/models:ro
    environment:
      - MULTISEEDGEN_DATA_ROOT=/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
