[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiseedgen"
version = "3.0.1"                       # keep in sync with multiseedgen/constants.py
description = "Synthetic multi-seed object-detection dataset generator (segmentation + compositing + YOLO/COCO export)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Amr" }]
keywords = ["dataset", "synthetic-data", "object-detection", "segmentation", "yolo", "coco"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime. cv2 + numpy are the only hard imports of the CLI/pipeline; joblib /
# pyyaml / tqdm are import-guarded (optdeps.py) but every normal run wants them, so
# they ship as core. pydantic backs the validated Config (single source of truth).
# opencv-python-headless matches the Docker images and is correct for headless/server
# use; swap to opencv-python if you need cv2 GUI windows.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# GPU rembg (U^2-Net via onnxruntime-gpu). Pins mirror docker/Dockerfile.gpu: 1.27
# links CUDA 13 (no real runtime wheels yet), 1.26.0 links CUDA 12 which has them.
gpu = [
    "rembg[gpu]",
    "onnxruntime-gpu==1.26.0",
    "nvidia-cudnn-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
# CPU rembg only (no CUDA wheels) - for the classical+rembg path without a GPU.
rembg = ["rembg", "onnxruntime"]
# Optional Segment Anything backend (--segment sam). torch has no manylinux+CUDA pin
# here; install a CUDA torch from the pytorch index if you want GPU SAM (see docker/Dockerfile.sam).
sam = ["torch", "torchvision", "segment-anything"]
# FastAPI web UI. python-multipart backs the seed-upload endpoint (UploadFile/Form).
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=11",
    "python-multipart>=0.0.7",
]
# Developer tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.scripts]
seedgen = "multiseedgen.__main__:main"
multiseedgen-web = "multiseedgen.web.__main__:main"

[project.urls]
Repository = "https://github.com/Mohamed-Amr7/seed-dataset-generator"

[tool.setuptools.packages.find]
include = ["multiseedgen*"]

[tool.setuptools.package-data]
# Recursive: the Vite build emits index.html + a hashed assets/ subdir into static/.
"multiseedgen.web" = ["static/**/*"]

# --------------------------------------------------------------------------- #
# Tooling                                                                     #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["datasets", "seeds", "textures", "out", "models", "_uitest"]

[tool.ruff.lint]
# Pragmatic, signal-rich rule set: pyflakes (F), pycodestyle (E/W), import sorting (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced as an error
    "B008",   # FastAPI uses Query(...)/Body(...) as argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"multiseedgen/__init__.py" = ["F401"]       # public re-exports
"multiseedgen/web/__init__.py" = ["F401"]   # public re-exports
"seedgen.py" = ["F401"]                     # backward-compat re-export shim
# optdeps.py is built entirely around import guards + name-availability probes:
# the re-exported names (F401) and the bare `Parallel`/`yaml` existence checks
# (B018 useless-expression, F821 undefined-name) are intentional, not mistakes.
"multiseedgen/optdeps.py" = ["F401", "B018", "F821"]
"tests/*" = ["E402", "C408"]                # importorskip-guarded imports; dict(k=v) test kwargs

[tool.mypy]
# 3.12 matches the CI/runtime interpreter. numpy >= 2.2 ships PEP 695 `type` statements
# in its bundled stubs, which mypy rejects under an older target ("Type statement is only
# supported in Python 3.12 and greater"). 3.10-syntax compatibility for our own code is
# still enforced by ruff (target-version = "py310").
python_version = "3.12"
ignore_missing_imports = true               # cv2/rembg/torch/segment_anything ship no stubs
warn_redundant_casts = true
check_untyped_defs = true

# Gradual typing adoption: 13 of 16 modules already pass. The three below are the
# large legacy modules scheduled for rewrite; each override is removed (and the module
# typed cleanly) as its phase lands: segmentation + pipeline -> Phase 4, web.app -> Phase 5.
[[tool.mypy.overrides]]
module = [
    "multiseedgen.segmentation",
    "multiseedgen.segmentation.*",
    "multiseedgen.pipeline",
    "multiseedgen.web.app",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: end-to-end tests that generate a dataset (deselect with -m 'not slow')",
    "gpu: tests that require a CUDA GPU + onnxruntime-gpu (deselect with -m 'not gpu')",
    "golden: byte-exact golden tests pinned to this host's numpy/opencv (local-only; deselect in CI with -m 'not golden')",
]
