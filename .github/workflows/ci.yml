name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,web]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy multiseedgen

  test:
    name: Tests (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,web]"
      # The `golden` tests are pinned to a specific numpy/opencv build (byte-exact) and
      # the `gpu` tests need CUDA, so both are local-only; the rest (determinism,
      # config/seg-cache/schema contracts) are environment-portable.
      - name: Pytest
        run: pytest -m "not golden and not gpu" -v

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      # Rebuild the committed multiseedgen/web/static/ bundle from frontend/src. The next
      # step asserts the freshly built output matches what's checked in.
      - name: Build
        run: npm run build
      # Guard against committed-bundle drift. The packaged FastAPI app serves the committed
      # multiseedgen/web/static/ bundle, NOT frontend/src, so a source-only fix passes dev
      # and unit tests while the shipped app keeps serving stale JS (this has happened). The
      # bundle's filenames are content-hashed, so we diff the fresh build above against the
      # committed tree rather than pinning any hash. node-version + `npm ci` above keep the
      # build deterministic; reproduce locally by building with the Node in frontend/.nvmrc.
      - name: Verify committed bundle matches a fresh build
        run: |
          # Stage the output dir so brand-new hashed assets (untracked) are compared too,
          # not just modified/deleted tracked files. The CI checkout is throwaway, so
          # staging here is safe and lets one --cached diff report every kind of drift.
          git add -A -- ../multiseedgen/web/static
          if git diff --cached --quiet -- ../multiseedgen/web/static; then
            echo "Committed bundle is in sync with frontend/src. ✓"
          else
            echo "::error::Committed Vite bundle is stale: multiseedgen/web/static/ does not match a fresh build of frontend/src. Run 'cd frontend && npm run build' and commit the result."
            echo "----- drifted files -----"
            git --no-pager diff --cached --name-status -- ../multiseedgen/web/static
            echo "----- summary -----"
            git --no-pager diff --cached --stat -- ../multiseedgen/web/static
            exit 1
          fi
