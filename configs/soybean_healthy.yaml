# Soybean (Healthy) — single class; pale soybean on cream tray, cast shadow + watermark.
# Narrow subset of seeds/Test/images (133 Healthy sources). See docs/RECOMMENDED_SETTINGS.md.
config:
  sources: seeds/Test/images/Healthy
  out: datasets/soybean_healthy
  class_mode: single          # one "seed" class (Healthy soybean)
  num_images: 2500            # bounded by 133 unique cut-outs; tune as needed
  img_size: 640
  min_seeds: 6
  max_seeds: 22
  scale_min: 0.06
  scale_max: 0.18
  bg_from_sources: true       # recover the real cream tray (domain match)
  neg_frac: 0.12
  segment: rembg              # cleanly drops cast shadow + avoids watermark text
  rembg_provider: auto
  # gpu_seg_jobs omitted -> auto-scales sessions to free VRAM; a per-image OOM->CPU
  # fallback also prevents a hard crash. Set a number (e.g. 2) only to cap manually.
  fmt: yolo-seg               # schema-identical to seeds/Test/annotations/Healthy/*.txt
  # per-seed augmentation (label-safe; robustness on the hard photometric case)
  aug_gamma: 0.2
  aug_shear: 4.0
  degrade: true
  noise_sigma: 3
  jpeg_quality_min: 75
  jpeg_quality_max: 95
  blur_max_sigma: 0.6
  shadow_dir_mode: scene
  # leakage-safe split + provenance. Small pool (133 sources) -> modest holdout.
  # (single class -> no class-balanced; yolo-seg -> no COCO extra_annotations/multilabel_csv)
  val_seed_holdout: 0.15      # source seeds reserved for val only (never seen in train)
  provenance: true            # provenance_<split>.jsonl maps boxes -> source seeds
  qa_report: true
  visualize_count: 12
  seed: 7
